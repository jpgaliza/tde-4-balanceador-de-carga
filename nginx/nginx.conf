worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" backend="$upstream_addr" response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Carrega a configuração ativa do upstream (Round Robin ou Least Connections)
    include /etc/nginx/conf.d/upstream.conf;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://shopnow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tolerância a falhas e failover automático instantâneo
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 4s;

            # Header HTTP customizado indicando o backend escolhido pelo Nginx
            add_header X-Backend-Server $upstream_addr always;
        }

        # Endpoint de status do próprio balanceador
        location /lb-status {
            access_log off;
            return 200 "Nginx Load Balancer is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
